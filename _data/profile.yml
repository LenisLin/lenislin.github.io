summary:
  en: 'I am a Ph.D. candidate in computational biology and bioinformatics at Xiamen University, advised
    by [Rongshan Yu](https://scholar.google.com/citations?hl=en&user=Uh1EpKQAAAAJ). Since October 2026,
    I have also been an intern at Alibaba DAMO Academy.


    I develop computational methods for single-cell and spatial omics, perturbation-response modeling,
    and translational biomarker discovery. I am also interested in biomedical agents that connect multimodal
    evidence with scientific workflows.'
  zh: '我是林育祥，厦门大学健康医疗大数据研究院计算生物学与生物信息学博士研究生，导师为 [Rongshan Yu](https://scholar.google.com/citations?hl=en&user=Uh1EpKQAAAAJ)。自
    2026 年 10 月起，我也在阿里巴巴达摩院实习。


    我的研究涉及单细胞与空间组学、扰动响应建模和转化医学标志物发现，同时关注连接多模态证据与科研流程的生物医学智能体。'
bio:
  en: 'I am Yuxiang Lin (林育祥), a Ph.D. candidate at the National Institute for Data Science in Health
    and Medicine, Xiamen University, majoring in computational biology and bioinformatics. I am supervised
    by [Rongshan Yu](https://scholar.google.com/citations?hl=en&user=Uh1EpKQAAAAJ).


    I received my B.S. in Biology from the State Key Laboratory of Cellular Stress Biology, School of
    Life Sciences, Xiamen University (2018-2022).


    My research is organized around three connected interests:


    - **Computational biology:** developing computational methods for clinically relevant tumor microenvironment
    niche discovery, single-cell recurrence risk modeling, spatial transcriptomics prediction, and perturbation-response
    benchmarking, represented by TiRank, scRank, ST-Align, HyperST, and Chem2Gen-Bench.

    - **Biomedical agents:** exploring agentic AI systems for biomedical research, including literature-aware
    reasoning, multimodal evidence integration, tool-augmented data analysis, and workflow automation
    for diagnosis, prognosis, and mechanism discovery.

    - **Multi-omics for medicine:** integrating single-cell, spatial, transcriptomic, proteomic, and imaging
    data to support disease mechanism discovery and translational biomarker analysis.

    '
  zh: '我是林育祥（Yuxiang Lin），目前是厦门大学健康医疗大数据研究院（National Institute for Data Science in Health and Medicine,
    Xiamen University）博士生，专业方向为计算生物学/生物信息学，导师为 [Rongshan Yu](https://scholar.google.com/citations?hl=en&user=Uh1EpKQAAAAJ)。


    本科阶段就读于厦门大学生命科学学院 State Key Laboratory of Cellular Stress Biology，获得生物学学士学位（2018-2022）。


    我的研究兴趣主要围绕三个相互关联的方向展开：


    - **Computational biology:** 开发面向临床问题的计算方法，用于肿瘤微环境生态位发现、单细胞复发风险建模、空间转录组预测和扰动响应基准评估，代表性工作包括 TiRank、scRank、ST-Align、HyperST
    和 Chem2Gen-Bench。

    - **Biomedical agents:** 探索智能体在生物医学研究中的应用，包括文献驱动推理、多模态证据整合、工具调用式数据分析，以及面向诊断、预后和机制发现的自动化研究流程。

    - **Multi-omics for medicine:** 整合单细胞、空间组学、转录组、蛋白组和病理图像数据，服务于疾病机制解析和转化医学标志物发现。

    '
